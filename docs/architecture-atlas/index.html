<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fabulous Writing Atlas</title>
<meta name="description" content="Interactive map of Fabulous Writing's components, processes, third-party services and deployment.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
  --ground: #e8ecf0;
  --grid: rgba(44, 62, 84, 0.16);
  --panel: #ffffff;
  --panel-2: #f3f6f8;
  --ink: #16202a;
  --ink-2: #4c5966;
  --ink-3: #75828f;
  --line: #d1d8df;
  --edge: #93a0ad;
  --accent: #c2410c;
  --accent-ink: #ffffff;
  --accent-soft: rgba(194, 65, 12, 0.11);
  --shadow: 0 1px 2px rgba(18, 28, 38, 0.07), 0 10px 30px rgba(18, 28, 38, 0.10);
  --z-client: #0b7a72;
  --z-server: #4743c4;
  --z-data: #9a5a05;
  --z-external: #a2235c;
  --z-delivery: #4b7712;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Instrument Sans", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0c1116;
    --grid: rgba(150, 172, 194, 0.11);
    --panel: #131a21;
    --panel-2: #19222b;
    --ink: #e3e9ef;
    --ink-2: #a6b2be;
    --ink-3: #7b8895;
    --line: #29343f;
    --edge: #52606e;
    --accent: #ff8a4c;
    --accent-ink: #1b0e05;
    --accent-soft: rgba(255, 138, 76, 0.15);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 12px 32px rgba(0, 0, 0, 0.35);
    --z-client: #4cc3b4;
    --z-server: #9b98ff;
    --z-data: #e0a63c;
    --z-external: #ec7cad;
    --z-delivery: #9bc95a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0c1116;
  --grid: rgba(150, 172, 194, 0.11);
  --panel: #131a21;
  --panel-2: #19222b;
  --ink: #e3e9ef;
  --ink-2: #a6b2be;
  --ink-3: #7b8895;
  --line: #29343f;
  --edge: #52606e;
  --accent: #ff8a4c;
  --accent-ink: #1b0e05;
  --accent-soft: rgba(255, 138, 76, 0.15);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 12px 32px rgba(0, 0, 0, 0.35);
  --z-client: #4cc3b4;
  --z-server: #9b98ff;
  --z-data: #e0a63c;
  --z-external: #ec7cad;
  --z-delivery: #9bc95a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--ground);
  color: var(--ink);
  font: 15px/1.5 var(--body);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code { font-family: var(--mono); font-size: 0.86em; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; overflow-wrap: anywhere; }

/* ── Canvas ─────────────────────────────────────────────── */
#viewport {
  position: fixed; inset: 0;
  overflow: hidden;
  cursor: grab;
  touch-action: none;
  background-color: var(--ground);
  background-image: radial-gradient(circle, var(--grid) 1.1px, transparent 1.3px);
  --inv: 3;
}
#viewport.panning { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
#edge-labels { position: absolute; left: 0; top: 0; pointer-events: none; }

.zone {
  position: absolute;
  border-radius: 18px;
  background: color-mix(in srgb, var(--hue) 6%, transparent);
  border: 1.5px solid color-mix(in srgb, var(--hue) 30%, transparent);
}
.zone-head {
  position: absolute; left: 22px; top: 14px; right: 22px;
  display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap;
  background: none; border: 0; padding: 0; text-align: left; cursor: pointer;
}
.zone-title {
  font-family: var(--display);
  font-weight: 750;
  letter-spacing: -0.01em;
  font-size: max(30px, calc(14px * var(--inv)));
  line-height: 1.05;
  color: var(--hue);
}
.zone-head:hover .zone-title { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
.zone-sub { font-family: var(--mono); font-size: 13px; color: var(--ink-2); }
.band {
  position: absolute; left: 40px;
  font-family: var(--mono); font-size: max(12px, calc(8px * var(--inv)));
  letter-spacing: 0.12em; text-transform: uppercase;
  color: color-mix(in srgb, var(--hue) 75%, var(--ink-2));
  transform: translateY(-50%);
}
[data-lod="far"] .zone-sub, [data-lod="far"] .band { display: none; }

.node {
  position: absolute;
  display: flex; flex-direction: column; gap: 4px;
  padding: 12px 14px 12px;
  text-align: left;
  background: var(--panel);
  border: 1.5px solid color-mix(in srgb, var(--hue) 38%, var(--line));
  border-radius: 7px;
  cursor: pointer;
  overflow: hidden;
  transition: opacity 0.25s ease, border-color 0.15s ease, box-shadow 0.15s ease;
}
.node:hover { border-color: var(--hue); box-shadow: 0 0 0 calc(1.5px * var(--inv)) color-mix(in srgb, var(--hue) 25%, transparent); }
.node-kind {
  font-family: var(--mono); font-size: max(11px, calc(7.5px * var(--inv))); letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--hue);
}
.node-title {
  font-family: var(--display); font-weight: 650;
  font-size: max(17px, calc(10.5px * var(--inv)));
  line-height: 1.12;
  letter-spacing: -0.005em;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden;
}
.node-summary { font-size: 12.5px; line-height: 1.38; color: var(--ink-2); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
[data-lod="near"] .node-title { -webkit-line-clamp: 2; }
[data-lod="far"] .node-kind, [data-lod="far"] .node-summary,
[data-lod="mid"] .node-summary { display: none; }
[data-lod="far"] .node { justify-content: center; padding: 8px 10px; }
[data-lod="far"] .node-title { font-size: max(17px, calc(9px * var(--inv))); line-height: 1.04; -webkit-line-clamp: 2; }
[data-lod="mid"] .node-title { -webkit-line-clamp: 2; }
.node.selected { border-color: var(--hue); box-shadow: 0 0 0 calc(3px * var(--inv)) color-mix(in srgb, var(--hue) 35%, transparent); }
.node-steps {
  position: absolute; right: 8px; top: 8px;
  font-family: var(--mono); font-weight: 500; font-size: 11px;
  color: var(--accent-ink); background: var(--accent);
  border-radius: 999px; padding: 1px 7px;
  transform-origin: top right;
  scale: max(1, calc(var(--inv) * 0.62));
}
.node-steps:empty { display: none; }

.edge {
  fill: none; stroke: var(--edge);
  stroke-width: calc(1.2px * var(--inv));
  opacity: 0.38;
  transition: opacity 0.2s ease;
}
.edge.related, .edge.hovered { stroke: var(--ink-2); opacity: 1; stroke-width: calc(1.8px * var(--inv)); }
.has-focus .edge:not(.related):not(.hovered) { opacity: 0.14; }
.edge-label {
  position: absolute; transform: translate(-50%, -50%);
  font-family: var(--mono); font-size: 11px; color: var(--ink-2);
  background: var(--ground); padding: 0 5px; border-radius: 4px; white-space: nowrap;
}
[data-lod="far"] .edge-label, [data-lod="mid"] .edge-label { display: none; }
.has-focus .edge-label:not(.related):not(.hovered) { display: none; }
[data-lod="mid"] .edge-label.related, [data-lod="mid"] .edge-label.hovered { display: block; }

/* Process mode */
.flow-active .node:not(.in-flow) { opacity: 0.22; }
.flow-active .edge { opacity: 0.12; }
.flow-active .edge-label { display: none; }
.node.in-flow { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
.node.current { border-color: var(--accent); box-shadow: 0 0 0 calc(4px * var(--inv)) var(--accent-soft), var(--shadow); }
.node.from { border-style: dashed; border-color: var(--accent); }
.flow-edge { fill: none; stroke: var(--accent); }
.flow-edge.current { stroke-width: calc(3.2px * var(--inv)); }
.flow-edge.past { stroke-width: calc(1.8px * var(--inv)); opacity: 0.55; }
.flow-edge.future { stroke-width: calc(1.4px * var(--inv)); opacity: 0.35; stroke-dasharray: calc(5px * var(--inv)) calc(5px * var(--inv)); }
@media (prefers-reduced-motion: no-preference) {
  .flow-edge.current { stroke-dasharray: calc(10px * var(--inv)) calc(6px * var(--inv)); animation: march 1.1s linear infinite; }
  @keyframes march { to { stroke-dashoffset: calc(-16px * var(--inv)); } }
}

/* ── Floating chrome ───────────────────────────────────── */
.panel {
  position: fixed;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow);
}
#rail {
  left: 16px; top: 16px; bottom: 16px; width: 296px;
  display: flex; flex-direction: column;
  transition: transform 0.25s ease;
  z-index: 3;
}
#rail.collapsed { transform: translateX(calc(-100% - 24px)); }
.rail-head { padding: 18px 18px 12px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.brand h1 { margin: 0; font-family: var(--display); font-weight: 750; font-size: 22px; letter-spacing: -0.015em; line-height: 1.1; text-wrap: balance; }
.brand h1 span { color: var(--accent); }
.rail-meta { margin: 4px 0 12px; font-size: 12.5px; color: var(--ink-3); }
.search-wrap { position: relative; }
#search {
  width: 100%; padding: 8px 10px 8px 32px;
  border: 1px solid var(--line); border-radius: 8px;
  background: var(--panel-2); color: var(--ink);
  font: inherit; font-size: 14px;
}
#search::placeholder { color: var(--ink-3); }
.search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; stroke: var(--ink-3); }
.search-wrap kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-family: var(--mono); font-size: 11px; color: var(--ink-3); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.rail-scroll { overflow-y: auto; padding: 6px 10px 14px; flex: 1; }
.flow-group h3 {
  margin: 14px 8px 6px;
  font-family: var(--mono); font-weight: 500; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3);
}
.flow-group ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.flow-item, .result {
  width: 100%; display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
  padding: 7px 8px; border: 0; border-radius: 7px; background: none; cursor: pointer; text-align: left;
}
.flow-item:hover, .result:hover { background: var(--panel-2); }
.flow-item.active { background: var(--accent-soft); }
.flow-item.active .flow-name { color: var(--accent); font-weight: 600; }
.flow-name { font-size: 14px; }
.flow-len { font-family: var(--mono); font-size: 11px; color: var(--ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.result { flex-direction: column; align-items: flex-start; gap: 0; }
.r-kind { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--hue, var(--accent)); }
.r-title { font-size: 14px; }
.empty { color: var(--ink-3); padding: 8px; margin: 0; }
.rail-foot { border-top: 1px solid var(--line); padding: 10px 14px; display: flex; gap: 8px; flex-wrap: wrap; }

.icon-btn, .text-btn {
  border: 1px solid var(--line); background: var(--panel); border-radius: 8px; cursor: pointer;
}
.icon-btn { width: 36px; height: 36px; display: grid; place-items: center; font-size: 18px; line-height: 1; }
.text-btn { padding: 5px 10px; font-size: 12.5px; color: var(--ink-2); }
.icon-btn:hover, .text-btn:hover { border-color: var(--ink-3); color: var(--ink); }

#rail-toggle { position: fixed; left: 16px; top: 16px; z-index: 2; box-shadow: var(--shadow); }
#rail:not(.collapsed) ~ #rail-toggle { visibility: hidden; }
.rail-close { width: 30px; height: 30px; font-size: 16px; }

#controls { right: 16px; bottom: 16px; padding: 8px; display: flex; flex-direction: column; gap: 8px; align-items: stretch; z-index: 2; }
.zoom-row { display: flex; gap: 6px; align-items: center; }
#zoom-level { font-family: var(--mono); font-size: 12px; color: var(--ink-2); min-width: 46px; text-align: center; font-variant-numeric: tabular-nums; }
#minimap { width: 200px; height: 136px; border-radius: 8px; background: var(--panel-2); cursor: crosshair; touch-action: none; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 11.5px; color: var(--ink-2); max-width: 200px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 9px; height: 9px; border-radius: 2px; background: var(--hue); display: inline-block; }

/* ── Drawer ─────────────────────────────────────────────── */
#drawer {
  right: 16px; top: 16px; bottom: 16px; width: 410px;
  display: flex; flex-direction: column;
  transform: translateX(calc(100% + 24px));
  transition: transform 0.28s ease;
  z-index: 3;
}
#drawer.open { transform: none; }
#drawer-close { position: absolute; right: 12px; top: 12px; z-index: 1; width: 32px; height: 32px; font-size: 16px; }
#drawer-body { overflow-y: auto; padding: 22px 24px 28px; }
.d-head { padding-right: 32px; }
.eyebrow { margin: 0 0 4px; font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--hue, var(--accent)); }
.d-title { margin: 0 0 10px; font-family: var(--display); font-weight: 750; font-size: 27px; line-height: 1.08; letter-spacing: -0.015em; text-wrap: balance; }
.d-sub { margin: -4px 0 12px; font-family: var(--mono); font-size: 12.5px; color: var(--ink-2); }
.lead { font-size: 16px; line-height: 1.5; margin: 0 0 14px; color: var(--ink); }
.d-section .summary { margin: 0 0 10px; color: var(--ink); font-weight: 500; }
.prose p, .step-body p { margin: 0 0 10px; color: var(--ink-2); }
.prose strong, .step-body strong { color: var(--ink); font-weight: 600; }
.bullets { margin: 0 0 10px; padding-left: 18px; color: var(--ink-2); }
.bullets li { margin: 0 0 5px; }
.bullets li::marker { color: var(--accent); }
.d-section { margin-top: 20px; }
.d-section h3 { margin: 0 0 8px; font-family: var(--mono); font-weight: 500; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: var(--panel-2); border-radius: 999px;
  padding: 4px 11px; font-size: 13px; cursor: pointer; text-align: left;
}
.chip:hover { border-color: var(--ink-3); }
.chip-flow { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); background: var(--accent-soft); }
.chip-flow:hover { border-color: var(--accent); }
.chip-zone, .chip-node { border-color: color-mix(in srgb, var(--hue) 45%, var(--line)); background: color-mix(in srgb, var(--hue) 9%, var(--panel)); }
.chip-zone:hover, .chip-node:hover { border-color: var(--hue); }
.files, .docs { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.files a { font-family: var(--mono); font-size: 12.5px; overflow-wrap: anywhere; }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
a:hover { text-decoration-thickness: 2px; }
.back { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; margin: 0 0 12px; font-size: 13.5px; }
.back:hover { text-decoration: underline; }

.stepper { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; margin: 6px 0 8px; }
.step-btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 7px 12px; cursor: pointer; font-size: 13.5px; }
.step-btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.step-btn:disabled { opacity: 0.4; cursor: default; }
.step-count { text-align: center; font-family: var(--mono); font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.flow-tools { display: flex; gap: 14px; margin-bottom: 14px; }
.link-btn { border: 0; background: none; padding: 0; color: var(--ink-2); font-size: 13px; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; text-decoration-color: var(--line); }
.link-btn:hover { color: var(--ink); text-decoration-color: var(--ink-3); }
.steps { list-style: none; margin: 0; padding: 0; position: relative; }
.steps::before { content: ""; position: absolute; left: 12px; top: 14px; bottom: 14px; width: 1.5px; background: var(--line); }
.step { position: relative; }
.step-head { width: 100%; display: flex; gap: 12px; align-items: flex-start; padding: 6px 0; border: 0; background: none; cursor: pointer; text-align: left; }
.step-num {
  position: relative; flex: none; width: 25px; height: 25px; border-radius: 50%;
  display: grid; place-items: center;
  font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums;
  background: var(--panel); border: 1.5px solid var(--line); color: var(--ink-2);
}
.step.past .step-num { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); color: var(--accent); }
.step.current .step-num { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.step-title { padding-top: 2px; font-size: 14.5px; color: var(--ink-2); }
.step.current .step-title { color: var(--ink); font-weight: 600; }
.step-head:hover .step-title { color: var(--ink); }
.step-body { margin: 2px 0 10px 37px; padding: 12px 14px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; }
.step-body p:last-child { margin-bottom: 0; }
.step-where { font-size: 13px; }
.inline-link { border: 0; background: none; padding: 0; cursor: pointer; color: var(--hue); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }

@media (max-width: 759px) {
  #rail { left: 8px; right: 8px; top: 8px; bottom: auto; max-height: 70vh; width: auto; }
  #rail.collapsed { transform: translateY(calc(-100% - 24px)); }
  #rail-toggle { left: 8px; top: 8px; }
  #drawer { left: 8px; right: 8px; top: auto; bottom: 8px; width: auto; height: 58vh; transform: translateY(calc(100% + 24px)); }
  #drawer.open { transform: none; }
  #controls { right: 8px; top: 8px; bottom: auto; }
  #minimap, .legend { display: none; }
  #drawer-body { padding: 18px 16px 24px; }
}
@media (prefers-reduced-motion: reduce) {
  #rail, #drawer, .node, .edge { transition: none; }
}
</style>
</head>
<body>
<div id="viewport" data-lod="far" aria-label="Architecture map. Drag to pan, scroll to zoom.">
  <div id="world">
    <svg id="edges" aria-hidden="true">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="var(--edge)"/></marker>
        <marker id="arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker>
        <marker id="arrow-past" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker>
        <marker id="arrow-future" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)" opacity="0.6"/></marker>
      </defs>
    </svg>
    <div id="edge-labels"></div>
  </div>
</div>

<aside id="rail" class="panel" aria-label="Processes and search">
  <div class="rail-head">
    <div class="brand">
      <h1>Fabulous Writing <span>Atlas</span></h1>
      <button id="rail-close" class="icon-btn rail-close" type="button" aria-label="Hide panel">‹</button>
    </div>
    <p class="rail-meta">Components, processes and infrastructure of v0.7.3</p>
    <div class="search-wrap">
      <svg viewBox="0 0 16 16" fill="none" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>
      <input id="search" type="search" placeholder="Find a component or process" aria-label="Find a component or process" autocomplete="off">
      <kbd>/</kbd>
    </div>
  </div>
  <div class="rail-scroll">
    <div id="results" hidden></div>
    <nav id="flow-list" aria-label="Processes"></nav>
  </div>
  <div class="rail-foot">
    <button id="about" class="text-btn" type="button">Overview</button>
    <button id="theme" class="text-btn" type="button">Theme: auto</button>
  </div>
</aside>
<button id="rail-toggle" class="icon-btn panel" type="button" aria-label="Show processes and search" aria-controls="rail">☰</button>

<aside id="drawer" class="panel" aria-label="Details" aria-hidden="true">
  <button id="drawer-close" class="icon-btn" type="button" aria-label="Close details">✕</button>
  <div id="drawer-body"></div>
</aside>

<div id="controls" class="panel" role="group" aria-label="Map controls">
  <div class="zoom-row">
    <button id="zoom-out" class="icon-btn" type="button" aria-label="Zoom out">−</button>
    <span id="zoom-level" aria-live="off">100%</span>
    <button id="zoom-in" class="icon-btn" type="button" aria-label="Zoom in">+</button>
    <button id="zoom-fit" class="icon-btn" type="button" aria-label="Fit whole map" title="Fit whole map (0)">⤢</button>
  </div>
  <canvas id="minimap" aria-label="Minimap: click to move the view"></canvas>
  <div class="legend" aria-label="Legend">
    <span style="--hue: var(--z-client)"><i></i>Clients</span>
    <span style="--hue: var(--z-server)"><i></i>Backend</span>
    <span style="--hue: var(--z-data)"><i></i>Data</span>
    <span style="--hue: var(--z-external)"><i></i>Third parties</span>
    <span style="--hue: var(--z-delivery)"><i></i>Delivery</span>
  </div>
</div>

<script src="atlas-data.js"></script>
<script src="atlas.js"></script>
</body>
</html>
