name: Architecture Atlas

# Publishes docs/architecture-atlas/ (static HTML/JS, no build step) to
# GitHub Pages at https://saigyo.github.io/fabulous-writing/. The
# github-pages environment only accepts deployments from main, so this
# runs on pushes to main that touch the atlas, or by manual dispatch.
on:
  push:
    branches: [main]
    paths:
      - "docs/architecture-atlas/**"
      - ".github/workflows/atlas-pages.yml"
  workflow_dispatch:

# One deployment at a time; never cancel one mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/architecture-atlas
      - id: deployment
        uses: actions/deploy-pages@v5
