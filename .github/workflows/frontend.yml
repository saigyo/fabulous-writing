name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: >
          npm test -- --coverage --coverage.reporter=json-summary
          --coverage.reporter=html --coverage.reporter=text-summary
          --reporter=default --reporter=junit --outputFile.junit=test-results.xml

      - name: Job summary
        if: always()
        run: node scripts/ci-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: npm run build

      - name: Embed bundle guard
        run: npm run check:embed

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-results
          path: frontend/test-results.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage-report
          path: frontend/coverage

      - name: Upload coverage summary
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/coverage-summary.json

  badge:
    # Publish the coverage percentage as shields.io endpoint JSON on the
    # `badges` branch (rendered by the README badge). Only for pushes to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: badges

      - uses: actions/download-artifact@v8
        with:
          name: frontend-coverage
          path: /tmp/coverage

      - name: Write badge JSON
        run: |
          pct=$(jq -r '.total.lines.pct | round' /tmp/coverage/coverage-summary.json)
          if [ "$pct" -ge 80 ]; then color=brightgreen
          elif [ "$pct" -ge 50 ]; then color=yellow
          else color=red; fi
          jq -n --arg msg "${pct}%" --arg color "$color" \
            '{schemaVersion: 1, label: "frontend coverage", message: $msg, color: $color}' \
            > frontend-coverage.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend-coverage.json
          git diff --cached --quiet && exit 0
          git commit -m "Update frontend coverage badge"
          # The backend badge job may push to `badges` concurrently.
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          git push
