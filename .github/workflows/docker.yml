name: Docker CI

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker/**"
      - "fabulous.sh"
      - "scripts/**"
      - "backend/app/**"
      - "backend/rules/**"
      - "backend/demos/**"
      - "backend/scripts/**"
      - "THIRD-PARTY-NOTICES.md"
      - "LICENSE"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - "frontend/src/**"
      - "frontend/public/**"
      - "frontend/index.html"
      - "frontend/vite.config.ts"
      - "frontend/tsconfig*.json"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker/**"
      - "fabulous.sh"
      - "scripts/**"
      - "backend/app/**"
      - "backend/rules/**"
      - "backend/demos/**"
      - "backend/scripts/**"
      - "THIRD-PARTY-NOTICES.md"
      - "LICENSE"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - "frontend/src/**"
      - "frontend/public/**"
      - "frontend/index.html"
      - "frontend/vite.config.ts"
      - "frontend/tsconfig*.json"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR (registry cache reads)
        if: ${{ github.event.pull_request.head.repo.fork != true }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (amd64, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=registry,ref=ghcr.io/saigyo/fabulous-writing:buildcache

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Runtime + models groups: the collector reads license texts from
      # installed dist-info, so the model wheels must be present (~500 MB).
      - name: Install backend deps (runtime + models)
        run: uv sync --locked --no-dev --group models
        working-directory: backend
      - name: Install frontend deps
        run: npm ci
        working-directory: frontend
      - name: Regenerate notices
        run: uv run --project backend --no-sync python scripts/collect-licenses.py
      - name: Fail on drift
        run: git diff --exit-code THIRD-PARTY-NOTICES.md
