name: Extension CI

on:
  push:
    branches: [main]
    paths:
      - "clients/browser-extension/**"
      - "frontend/src/embed/**"
      - "frontend/src/simulator/**"
      - "frontend/src/findings/severity.ts"
      - "frontend/src/types.ts"
      - ".github/workflows/extension.yml"
  pull_request:
    paths:
      - "clients/browser-extension/**"
      - "frontend/src/embed/**"
      - "frontend/src/simulator/**"
      - "frontend/src/findings/severity.ts"
      - "frontend/src/types.ts"
      - ".github/workflows/extension.yml"

concurrency:
  group: extension-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/browser-extension
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: clients/browser-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
