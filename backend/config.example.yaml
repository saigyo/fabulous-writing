# Copy to config.yaml to override defaults. All keys are optional.
# API keys are read from the environment only, never from this file:
#   claude  -> ANTHROPIC_API_KEY
#   openai  -> OPENAI_API_KEY
#   mistral -> MISTRAL_API_KEY
#   bedrock -> standard AWS credential chain (env vars, profile, role)
#   extra_providers entries -> <NAME>_API_KEY (deepseek -> DEEPSEEK_API_KEY)

# db_path: data/fabulous.db
# rules_dir: rules
# seed_terminology: true   # seed an example domain into an empty terminology DB
# seed_example_profiles: true  # seed Marketing / Technical Documentation example
#                              # profiles (EN/DE/JA) on first start; deletions stick
# vet_suggestions: true    # deterministic vetting of LLM-generated fixes
# dictionaries_dir: dictionaries  # hunspell dicts (scripts/install-dictionaries.sh)

# Authentication. These are startup-only: none of them can be changed
# through the API, so a stolen admin session cannot lift its own limits.
auth:
  mode: local                   # 'supabase' arrives with sub-project 2
  # Dev-only: allow a generated, per-start signing secret when
  # FW_AUTH_SECRET is unset. Tokens then die on every restart.
  ephemeral_secret: false
  # When false, no API call may create or promote an admin account.
  allow_additional_admins: false

# Required environment variables (never stored in this file). FW_AUTH_SECRET
# is the only one with an escape hatch: ephemeral_secret above (dev only).
# The two admin variables are always required while the users table is empty.
#   FW_AUTH_SECRET     signing secret, >= 32 chars, randomly generated:
#                      openssl rand -base64 32
#   FW_ADMIN_EMAIL     bootstrap admin, used only while the users table is empty
#   FW_ADMIN_PASSWORD  bootstrap admin password, >= 12 chars

providers:
  ollama_base_url: http://localhost:11434
  ollama_model: llama3.1
  anthropic_model: claude-sonnet-5
  openai_model: gpt-5-mini
  mistral_model: mistral-small-latest
  # bedrock_region: eu-central-1     # default: AWS region chain
  # Bedrock model/profile ids are region-family-specific (us./eu./apac.).
  # With list permissions (bedrock:ListFoundationModels,
  # bedrock:ListInferenceProfiles) the model dropdown is discovered live;
  # otherwise pin the invokable ids here:
  bedrock_model: us.anthropic.claude-sonnet-4-5-20250929-v1:0
  # bedrock_models:
  #   - us.anthropic.claude-sonnet-4-5-20250929-v1:0
  #   - us.anthropic.claude-haiku-4-5-20251001-v1:0
  default_provider: ollama
  # Additional OpenAI-compatible providers become first-class entries in the
  # header and profiles. The entry name derives the API-key env variable
  # (deepseek -> DEEPSEEK_API_KEY); keys are never stored in this file.
  # Names: lowercase, starting with a letter ([a-z][a-z0-9_]*); must not
  # shadow the built-in five.
  # extra_providers:
  #   deepseek:
  #     base_url: https://api.deepseek.com/v1
  #     default_model: deepseek-v4-pro
  #   qwen:
  #     base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
  #     default_model: qwen3.7-max
  #   openrouter:
  #     base_url: https://openrouter.ai/api/v1
  #     default_model: anthropic/claude-sonnet-5
  #     exclude_model_fragments: [embedding]   # optional /models filter

# spaCy models per language for token_pattern/dependency rules.
# Install via ./scripts/install-models.sh <lang>...
# nlp:
#   models:
#     en: en_core_web_sm
#     de: de_core_news_sm
#     fr: fr_core_news_sm
#     es: es_core_news_sm
#     it: it_core_news_sm
#     ja: ja_ginza          # fallback: ja_core_news_sm (see README)
#     zh: zh_core_web_sm

# Quality-tier routing: per language, which provider+model each tier
# (quality | balanced | cheap | local) resolves to. Defaults ship in code
# (from docs/model-recommendations.md); a language listed here replaces
# that language's whole tier map, unlisted languages keep the defaults.
# Tiers whose provider is not configured show as unavailable in the UI.
# routing:
#   default_tier: balanced
#   languages:
#     de:
#       quality:  { provider: claude,  model: claude-opus-4-8 }
#       balanced: { provider: mistral, model: mistral-large-latest }
#       cheap:    { provider: gemini,  model: models/gemini-flash-latest }
#       local:    { provider: ollama,  model: mistral-nemo:12b-instruct-2407-q6_K }
