# Demonstrates: token_pattern with a REGEX text condition.
extends: token_pattern
message: "'%s' — use 'a' before a consonant sound."
level: warning
category: grammar
pattern:
  - {LOWER: an}
  - {TEXT: {REGEX: '^[bcdfgjklmnpqrstvwz]'}}
examples:
  bad:
    - "She gave an presentation about writing."
  good:
    - "She gave an honest answer in an hour."
