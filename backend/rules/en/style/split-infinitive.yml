# Demonstrates: token_pattern mixing fine-grained tags (TAG) with POS and OP.
extends: token_pattern
message: "'%s' splits the infinitive — consider moving the adverb."
level: suggestion
category: style
pattern:
  - {TAG: TO}
  - {POS: ADV, OP: "+"}
  - {TAG: VB}
examples:
  bad:
    - "We want to quickly finish the report."
  good:
    - "We want to finish the report quickly."
