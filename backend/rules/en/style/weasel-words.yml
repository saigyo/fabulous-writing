extends: existence
message: "'%s' is a weasel word — be specific about how much or how many."
level: warning
category: style
ignorecase: true
tokens:
  - very
  - fairly
  - extremely
  - somewhat
  - quite
  - rather
  - really
  - relatively
  - various
  - a number of
  - in some cases
examples:
  bad:
    - "This is very interesting and somewhat useful."
  good:
    - "This is a precise and useful result."
