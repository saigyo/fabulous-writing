extends: occurrence
message: "This sentence is longer than 30 words — consider splitting it."
level: suggestion
category: clarity
scope: sentence
token: '\b\w+\b'
max: 30
examples:
  bad:
    - "This sentence keeps adding clause after clause because the writer never stops to breathe, piling words upon words until any reader loses the thread entirely and forgets where the whole thing began."
  good:
    - "Short sentence."
