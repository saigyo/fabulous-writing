# Demonstrates: substitution for a common inflected error.
extends: substitution
message: "„%s“ — „einzig“ hat keinen Superlativ; richtig ist „%s“."
level: error
category: grammar
ignorecase: true
swap:
  einzigste: einzige
  einzigster: einziger
  einzigstes: einziges
  einzigsten: einzigen
examples:
  bad:
    - "Das ist das einzigste Problem."
  good:
    - "Das ist das einzige Problem."
