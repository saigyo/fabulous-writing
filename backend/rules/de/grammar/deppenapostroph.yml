# Requires a capitalized stem (names: „Anna's“) and stoplists common verb
# contractions (geht's, war's, Gibt's …), which are legitimate. Residual
# gaps: brand names spelled with apostrophe (McDonald's) still fire — they
# are capitalized names, deterministically indistinguishable; warning
# severity carries it. Lowercase-stem Deppenapostrophe („des auto's“) now
# escape — accepted trade-off for not flagging verb contractions.
extends: existence
message: "Apostroph vor Genitiv-s — im Deutschen meist falsch („Annas Laden“)."
level: warning
category: grammar
raw:
  - "\\b(?!(?:[Gg]eht|[Gg]ibt|[Ww]ar|[Hh]at|[Ii]st|[Kk]ommt|[Mm]acht|[Tt]ut|[Ww]ird|[Bb]leibt|[Ll]äuft)['’]s)[A-ZÄÖÜ]\\w*['’]s\\b"
examples:
  bad:
    - "Anna's Laden ist geöffnet."
  good:
    - "Annas Laden ist geöffnet."
    - "Wie geht's dir heute?"
    - "Das war's für heute."
