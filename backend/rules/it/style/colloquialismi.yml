# Colloquialisms in documentation. « tipo » from the spec's candidate
# list is deliberately absent: as a filler it is inseparable from the
# legitimate « tipo di / questo tipo » uses without NLP context, so it
# would over-fire at warning level.
extends: existence
message: "«%s» è colloquiale — usare un termine preciso nella documentazione."
level: warning
category: style
pack: techdocs
ignorecase: true
tokens:
  - roba
  - un sacco di
examples:
  bad:
    - "Questa roba capita un sacco di volte dopo un aggiornamento."
  good:
    - "Questo problema si presenta spesso dopo un aggiornamento."
