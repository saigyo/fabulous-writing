# Hedges undermine documentation. CJK tokens have no word boundary to
# stop a raw match, so both regex entries carry lookarounds: 可能 excludes
# the noun 可能性 (lookahead) and the non-hedges 不可能 (assertion) /
# 尽可能 (intensifier) (lookbehind); 大概 excludes 大概率 ("high
# probability", different morphology) and 大概念 (lookahead).
extends: existence
message: "「%s」削弱文档的确定性 — 说明确切行为或给出确切条件。"
level: suggestion
category: style
pack: techdocs
tokens: [或许, 我觉得, 应该是]
raw:
  - "(?<![不尽])可能(?!性)"
  - "大概(?![率念])"
examples:
  bad:
    - "缓存可能已经过期,大概重启一下就行。"
  good:
    - "缓存十分钟后过期,重启服务即可清除。"
    - "需要评估这种做法的可能性。"
    - "这种情况不可能发生。"
    - "大概率会成功。"
