# Demonstrates: the consistency check type. Sentences are classified as
# 敬体 (polite, sentence-final です/ます/ください) or 常体 (plain — the
# default variant: any other predicate ending). Minority sentences get
# flagged; polite is declared first, so it wins a 50/50 tie. Headings and
# 体言止め are unclassified. The polite variant matches SURFACE forms, not
# lemmas: matching LEMMA くださる would misclassify plain honorific
# 「くださった」 (surface くださっ, within the anchor window) as polite,
# while the surface list catches request-form ください only. The POS gate
# keeps ADJ まし (「その方がましだ」) from reading as polite ます. GiNZA
# emits でしょう/ましょう as fused single tokens, so both the fused and the
# split (でしょ/ましょ) surfaces are listed.
# Bad examples must mix styles, so they are multi-sentence strings.
extends: consistency
message: "文体が混在しています — 敬体（です・ます）と常体（だ・である）のどちらかに統一してください。"
level: warning
category: style
variants:
  polite:
    pattern:
      - {TEXT: {IN: [です, でし, でしょ, でしょう, ます, まし, ませ, ましょ, ましょう, ください]}, POS: {IN: [AUX, VERB]}}
    anchor: end
  plain:
    default: true
examples:
  bad:
    - "本製品は高速です。設定も簡単だ。導入も容易です。"
  good:
    - "本製品は高速です。設定も簡単です。"
    - "本製品は高速だ。設定も簡単である。"
    - "資料をご確認ください。ご質問があればお知らせください。よろしくお願いします。"
    - "明日は晴れるでしょう。遠足は決行します。"
