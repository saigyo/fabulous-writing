extends: substitution
message: "«%s» es más directo — «%s» es un circunloquio."
level: suggestion
category: clarity
ignorecase: true
swap:
  en base a: según
  en el día de hoy: hoy
  a la mayor brevedad: pronto
examples:
  bad:
    - "En base a los datos, decidimos."
  good:
    - "Según los datos, decidimos."
