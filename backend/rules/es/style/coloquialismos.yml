# Colloquialisms in documentation. « cosa » from the spec's candidate
# list is deliberately absent — as a bare noun it is everyday neutral
# Spanish and would over-fire; « a tope » replaces it as an
# unambiguously colloquial marker.
extends: existence
message: "«%s» es coloquial — use un término preciso en la documentación."
level: warning
category: style
pack: techdocs
ignorecase: true
tokens:
  - un montón
  - o sea
  - a tope
examples:
  bad:
    - "Esto pasa un montón después de una actualización."
  good:
    - "Esto ocurre con frecuencia después de una actualización."
