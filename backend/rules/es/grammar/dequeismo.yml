# Demonstrates: token_pattern with lemma sets (dequeísmo).
extends: token_pattern
message: "«%s» es dequeísmo — se dice «pensar que», no «pensar de que»."
level: error
category: grammar
pattern:
  - {LEMMA: {IN: [pensar, creer, opinar]}}
  - {LOWER: de}
  - {LOWER: que}
examples:
  bad:
    - "Pienso de que es una buena idea."
  good:
    - "Pienso que es una buena idea."
