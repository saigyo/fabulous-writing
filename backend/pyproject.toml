[project]
name = "fabulous-writing-backend"
version = "0.1.0"
description = "Checking backend for Fabulous Writing"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.121.0",
    "bcrypt>=4.2.0",
    "boto3>=1.43.69",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "httpx2>=2.10.0",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.2",
    "pydantic>=2.13.4",
    "pyjwt[crypto]>=2.13.0",
    "pyspellchecker>=0.9.0",
    "pyyaml>=6.0.3",
    "spacy>=3.8.15",
    "spylls>=0.1.7",
    "supabase-auth>=2.31",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
models = [
    "de-core-news-sm",
    "en-core-web-sm",
    "es-core-news-sm>=3.8.0",
    "fr-core-news-sm>=3.8.0",
    "ginza>=5.2.0",
    "it-core-news-sm>=3.8.0",
    "ja-ginza>=5.2.0",
    "zh-core-web-sm>=3.8.0",
]
dev = [
    { include-group = "models" },
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-n auto --dist load"
filterwarnings = [
    # B34 (#112): unclosed sqlite connections must fail the suite, not
    # scroll past as ignored-by-default ResourceWarnings. The second
    # entry catches the GC-time case: a ResourceWarning raised inside
    # __del__ cannot propagate and reaches pytest via the unraisable-
    # exception hook as PytestUnraisableExceptionWarning instead.
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
    # spylls never closes its dictionary file handles (upstream:
    # spylls/hunspell/readers/file_reader.py, reached via
    # app/checkers/llm/vetting.py Dictionary.from_files; the _hunspell
    # cache bounds the leak to one handle set per language per process).
    # Scoped to unclosed-FILE warnings from the dictionaries path only —
    # unclosed sqlite CONNECTIONS still fail (Step 6 proves it). Later
    # entries take precedence in pytest, so these sit below the errors.
    "ignore:(?s).*unclosed file.*dictionaries.*:pytest.PytestUnraisableExceptionWarning",
    "ignore:(?s).*unclosed file.*dictionaries.*:ResourceWarning",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
de-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/de_core_news_sm-3.8.0/de_core_news_sm-3.8.0-py3-none-any.whl" }
fr-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/fr_core_news_sm-3.8.0/fr_core_news_sm-3.8.0-py3-none-any.whl" }
es-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/es_core_news_sm-3.8.0/es_core_news_sm-3.8.0-py3-none-any.whl" }
it-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/it_core_news_sm-3.8.0/it_core_news_sm-3.8.0-py3-none-any.whl" }
zh-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/zh_core_web_sm-3.8.0/zh_core_web_sm-3.8.0-py3-none-any.whl" }
