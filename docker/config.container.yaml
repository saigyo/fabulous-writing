# Base configuration for the container image. The setup wizard copies and
# extends this into /config/config.yaml — do not point FW_CONFIG_FILE here.
environment: production
db_path: /data/fabulous.db
frontend:
  dist_dir: /app/dist
# Single-origin serving: no cross-origin callers exist, so no origin is
# allowed. Dev keeps its own defaults (this file is container-only).
cors:
  origins: []
providers:
  default_provider: ollama
# CSP frame-ancestors entries for /embed (spec B43): controls which origins
# may iframe the embed surface. Empty (the default) disables embedding —
# uncomment and list scheme://host[:port] origins (or 'self') to allow one,
# e.g.:
#   allowed_ancestors:
#     - "https://your-host.example"
# WARNING: if you comment out `allowed_ancestors: []` below, comment out
# `embed:` too (or leave both alone) -- a bare `embed:` with nothing
# nested under it parses as YAML null, not an empty mapping, and Settings
# rejects that at startup (embed: Input should be a valid dictionary...),
# refusing to boot at all.
embed:
  allowed_ancestors: []
